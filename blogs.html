        body {

        .blog-section {
            text-align: center;

        }
        .blog-section h1 {
            font-weight: 800;

        }
        .blog-divider {
            width: 60px;
            height: 4px;
            background-color: #007bff;
            margin: 10px auto 20px;
            border-radius: 2px;
        }
        .blog-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s ease-in-out;
            background: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .blog-card:hover {
            transform: translateY(-5px);
        }
        .card-img-top {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            height: 180px;
            object-fit: cover;
        }
        .card-body {
            padding: 20px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #343a40;
        }
        .card-text {
            font-size: 0.95rem;
            color: #6c757d;
        }
        .read-more-btn {
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            padding: 8px 16px;
            transition: background 0.3s ease;
        }
        .read-more-btn:hover {
            background-color: #0056b3;
        }
